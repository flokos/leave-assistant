# Optional mirror of the local `make lint` / `make test-unit` contract (Q-13). No Docker, no secrets, no LLM calls.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv python install 3.14
      - run: uv sync --all-groups
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync lint-imports
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python -m leave_assistant.openapi > ../docs/api/openapi.json && git diff --exit-code -- ../docs/api/openapi.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm run --silent api:types && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run test
      - run: npm run build
