# leave-eval-v1 — the evaluation dataset of doc 11 §6 (M9).
#
# Written on 2026-11-06 from the seed corpus sources (backend/src/leave_assistant/seed/corpus/sources) and the seed
# business data, BEFORE any retrieval configuration was measured (docs/evaluation/README.md, "pre-registration").
#
# Relevance: a retrievable chunk is relevant to an item with grade g when it belongs to the labelled document (exact
# title) and contains one of the anchors after NFKC normalisation, case folding and whitespace removal (the scanned
# Greek PDF writes µ for μ and joins words). Grade 2 = the chunk states the answer; grade 1 = supporting or partial.
# A chunk matched by several labels gets the highest grade. `never_retrieve` lists documents that must not appear for
# the asking user at all (access boundaries).
#
# Kinds: knowledge (doc 11 scenarios answered from documents) · probe (extra retrieval questions) · unanswerable (no
# answer in the user's corpus; τ calibration) · boundary (visibility checks) · business · security · platform
# (deterministic scenarios covered by named tests; `live: true` ones are also run with real models).
# `scenario_test: true` items are asserted by tests/scenarios/test_knowledge_scenarios.py with the fake provider.
# `ragas: true` items form the live RAGAS subset (`reference` = the expected answer, in the question's language).

