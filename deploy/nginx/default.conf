# Frontend: static SPA + same-origin reverse proxy for the API (no CORS in the browser; SSE-friendly).
map $http_x_request_id $leave_request_id {   # accept a client-supplied correlation id, generate one otherwise (doc 09 §1)
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # internal API for n8n (doc 06 §2): only on the compose network (http://api:8000), never through the edge
    location /api/v1/internal/ { return 404; }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $leave_request_id;
        proxy_buffering off;          # server-sent events
        proxy_read_timeout 300s;
        client_max_body_size 30m;     # document uploads (limit enforced again by the API)
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
