# Leave Management AI Assistant — local deployment (ADR-0025). Profiles: core | automation (M8) | observability (M9) | eval (M9).
# Usage: cp deploy/.env.example deploy/.env; docker compose -f deploy/compose.yaml --profile core up -d --build
name: leave-assistant

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://app_rls:${LEAVE_DB_PASSWORD}@postgres:5432/leave
  DATABASE_OWNER_URL: postgresql+psycopg://app_owner:${LEAVE_DB_OWNER_PASSWORD}@postgres:5432/leave
  LANGGRAPH_DATABASE_URL: postgresql+psycopg://langgraph_rw:${LANGGRAPH_DB_PASSWORD}@postgres:5432/leave
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-leave-documents}
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: ${KC_PUBLIC_URL:-http://localhost:8081}
  KEYCLOAK_ADMIN_CLIENT_ID: backend-admin
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
  WORKER_MODE: ${WORKER_MODE:-separate}
  RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-pgvector}
  CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-mock}
  LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
  LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-gemini,groq}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  HF_HOME: /models

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    profiles: [core]
    environment:
      POSTGRES_DB: leave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LEAVE_DB_PASSWORD: ${LEAVE_DB_PASSWORD}
      LEAVE_DB_OWNER_PASSWORD: ${LEAVE_DB_OWNER_PASSWORD}
      LANGGRAPH_DB_PASSWORD: ${LANGGRAPH_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=16MB", "-c", "max_connections=100"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # localhost only: host-side integration tests and psql
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leave"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [core]
    command: ["start-dev", "--import-realm"]   # local HTTP only; production hardening (build + start --optimized, TLS) is out of scope
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro   # realm export (ADR-0004); skipped when the realm already exists
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HOSTNAME: ${KC_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      # placeholders resolved inside the realm export
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      N8N_CLIENT_SECRET: ${N8N_CLIENT_SECRET}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
    networks: [edge, internal]

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    profiles: [core]
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - seaweed:/data
      - ./seaweedfs/entrypoint.sh:/config/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -qO- http://127.0.0.1:8333/ >/dev/null 2>&1 || wget -S -qO- http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.33.0
    profiles: [core]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_DATABASE: /data/mailpit.db
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    volumes:
      - mailpit:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [edge, internal]

  api:
    build:
      context: ../backend
    image: leave-assistant/backend:dev
    profiles: [core]
    environment:
      <<: *backend-env
    volumes:
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3); sys.exit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    networks: [internal]

  worker:
    image: leave-assistant/backend:dev
    profiles: [core]
    command: ["python", "-m", "leave_assistant.worker"]
    environment:
      <<: *backend-env
      WORKER_MODE: separate
    volumes:
      - models:/models
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; p = '/tmp/leave-assistant-worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G
    networks: [internal]

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_AUTH_ENABLED: "true"
        VITE_KEYCLOAK_URL: ${KC_PUBLIC_URL:-http://localhost:8081}
    image: leave-assistant/frontend:dev
    profiles: [core]
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [edge, internal]

networks:
  edge:
  internal:

volumes:
  pgdata:
  seaweed:
  models:
  mailpit:
