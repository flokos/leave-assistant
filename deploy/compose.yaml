# Leave Management AI Assistant — local deployment (ADR-0025). Profiles: core | automation (M8) | observability (M9) | eval (M9).
# Usage: cp deploy/.env.example deploy/.env; docker compose -f deploy/compose.yaml --profile core up -d --build
name: leave-assistant

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://app_rls:${LEAVE_DB_PASSWORD}@postgres:5432/leave
  DATABASE_OWNER_URL: postgresql+psycopg://app_owner:${LEAVE_DB_OWNER_PASSWORD}@postgres:5432/leave
  LANGGRAPH_DATABASE_URL: postgresql+psycopg://langgraph_rw:${LANGGRAPH_DB_PASSWORD}@postgres:5432/leave
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-leave-documents}
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: ${KC_PUBLIC_URL:-http://localhost:8081}
  KEYCLOAK_ADMIN_CLIENT_ID: backend-admin
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
  WORKER_MODE: ${WORKER_MODE:-separate}
  RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-pgvector}
  CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-mock}
  LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
  LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-gemini,mistral,groq}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  # M6 agent core — model IDs are configuration (doc 02 §7, ADR-0010)
  GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST:-gemini-3.5-flash-lite}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
  GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
  GEMINI_THINKING_TOKENS: ${GEMINI_THINKING_TOKENS:-1024}
  GROQ_MODEL_FAST: ${GROQ_MODEL_FAST:-llama-3.1-8b-instant}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  MISTRAL_MODEL_FAST: ${MISTRAL_MODEL_FAST:-ministral-8b-2512}
  MISTRAL_MODEL: ${MISTRAL_MODEL:-ministral-14b-2512}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-25}
  RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
  RETRIEVAL_TAU: ${RETRIEVAL_TAU:-0.22}
  RERANK_CANDIDATES: ${RERANK_CANDIDATES:-10}
  RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-256}
  CONVERSATION_RETENTION_DAYS: ${CONVERSATION_RETENTION_DAYS:-90}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  HF_HOME: /models
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  DOCUMENT_PROCESS_TIMEOUT_SECONDS: ${DOCUMENT_PROCESS_TIMEOUT_SECONDS:-900}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
  OCR_LANGUAGES: ${OCR_LANGUAGES:-ell,eng}
  TORCH_THREADS: ${TORCH_THREADS:-2}
  WORKER_TORCH_THREADS: ${WORKER_TORCH_THREADS:-4}
  MKL_CBWR: ${MKL_CBWR:-AUTO}                 # AVX on AVX-only CPUs pins MKL's code path (R-27)
  # M5 — content security and privacy (doc 08 §7–§10); keys generated by `make env`, never committed
  APP_KEK: ${APP_KEK:-}
  VAULT_HMAC_KEY: ${VAULT_HMAC_KEY:-}
  VAULT_KEK: ${VAULT_KEK:-}
  PII_SCORE_THRESHOLD: ${PII_SCORE_THRESHOLD:-0.4}
  SUPPORTING_MAX_UPLOAD_MB: ${SUPPORTING_MAX_UPLOAD_MB:-10}
  DOWNLOAD_TOKEN_TTL_SECONDS: ${DOWNLOAD_TOKEN_TTL_SECONDS:-60}
  RETENTION_SCAN_INTERVAL_SECONDS: ${RETENTION_SCAN_INTERVAL_SECONDS:-86400}
  INJECTION_LLM_JUDGE: ${INJECTION_LLM_JUDGE:-false}
  # M8 — integrations (doc 06, doc 10); Google credentials are optional (the mock calendar is the default)
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  MOCK_CALENDAR_FAIL_MODE: ${MOCK_CALENDAR_FAIL_MODE:-none}
  MAIL_FROM_DOMAIN: ${MAIL_FROM_DOMAIN:-leave.local}
  PLATFORM_ALERT_EMAIL: ${PLATFORM_ALERT_EMAIL:-platform-alerts@leave.local}
  # M9 — evaluation and observability (doc 11, ADR-0011/0014/0022)
  RERANKER_BACKEND: ${RERANKER_BACKEND:-onnx}
  CHROMA_URL: http://chroma:8000
  LANGFUSE_HOST: http://langfuse-web:3000

# n8n (automation profile, M8 — doc 06). Execution-data hygiene per doc 06 §2: rendered e-mails are not kept.
x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
  GENERIC_TIMEZONE: Europe/Athens
  TZ: Europe/Athens
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
  EXECUTIONS_DATA_SAVE_ON_ERROR: all
  EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168"

# Langfuse (observability profile, M9 — ADR-0022): shared by web and worker.
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:-}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  REDIS_AUTH: ${VALKEY_PASSWORD:-}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY:-}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_KEY:-}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY:-}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_KEY:-}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs:8333
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    profiles: [core]
    environment:
      POSTGRES_DB: leave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LEAVE_DB_PASSWORD: ${LEAVE_DB_PASSWORD}
      LEAVE_DB_OWNER_PASSWORD: ${LEAVE_DB_OWNER_PASSWORD}
      LANGGRAPH_DB_PASSWORD: ${LANGGRAPH_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=16MB", "-c", "max_connections=100"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # localhost only: host-side integration tests and psql
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leave"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [core]
    command: ["start-dev", "--import-realm"]   # local HTTP only; production hardening (build + start --optimized, TLS) is out of scope
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro   # realm export (ADR-0004); skipped when the realm already exists
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HOSTNAME: ${KC_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      # placeholders resolved inside the realm export
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      N8N_CLIENT_SECRET: ${N8N_CLIENT_SECRET}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
    networks: [edge, internal]

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    profiles: [core]
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_ACCESS_KEY: ${LANGFUSE_S3_ACCESS_KEY:-}   # M9: Langfuse's own identity, bucket `langfuse` only
      LANGFUSE_S3_SECRET_KEY: ${LANGFUSE_S3_SECRET_KEY:-}
    volumes:
      - seaweed:/data
      - ./seaweedfs/entrypoint.sh:/config/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -qO- http://127.0.0.1:8333/ >/dev/null 2>&1 || wget -S -qO- http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.33.0
    profiles: [core]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_DATABASE: /data/mailpit.db
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    volumes:
      - mailpit:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [edge, internal]

  api:
    build:
      context: ../backend
    image: leave-assistant/backend:dev
    profiles: [core]
    environment:
      <<: *backend-env
    volumes:
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3); sys.exit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-2G}   # 3.5G in embedded mode (make up-staged): the ingestion child shares the cgroup (M9: peak 3.06 GB with ONNX)
    networks: [internal]

  worker:
    image: leave-assistant/backend:dev
    profiles: [core]
    command: ["python", "-m", "leave_assistant.worker"]
    environment:
      <<: *backend-env
      WORKER_MODE: separate
    volumes:
      - models:/models
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; p = '/tmp/leave-assistant-worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G
    networks: [internal]

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_AUTH_ENABLED: "true"
        VITE_KEYCLOAK_URL: ${KC_PUBLIC_URL:-http://localhost:8081}
    image: leave-assistant/frontend:dev
    profiles: [core]
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [edge, internal]

  n8n-init:
    image: n8nio/n8n:2.46.6
    profiles: [automation]
    entrypoint: ["/bin/sh", "/automation/init.sh"]
    environment:
      <<: *n8n-env
      N8N_CLIENT_SECRET: ${N8N_CLIENT_SECRET}
    volumes:
      - ../automation/n8n:/automation:ro
      - n8n:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [internal]

  n8n:
    image: n8nio/n8n:2.46.6
    profiles: [automation]
    # the owner account is managed by the environment; its bcrypt hash is derived at start, never stored
    entrypoint: ["/bin/sh", "/automation/start.sh"]
    environment:
      <<: *n8n-env
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"             # plain http on localhost only
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-automation@leave.local}
      N8N_INSTANCE_OWNER_FIRST_NAME: Automation
      N8N_INSTANCE_OWNER_LAST_NAME: Owner
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:-}
      NODE_OPTIONS: --max-old-space-size=${N8N_HEAP_MB:-768}   # 2.x needs > 256 MB heap at start (worklog M8)
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"   # UI on localhost only (doc 06 §7)
    volumes:
      - ../automation/n8n:/automation:ro
      - n8n:/home/node/.n8n
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${N8N_MEMORY_LIMIT:-1G}
    networks: [edge, internal]

  # --- eval profile (M9, ADR-0011): Chroma for the retrieval comparison only ------------------------------------
  chroma:
    image: chromadb/chroma:1.5.9
    profiles: [eval]
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8100}:8000"   # the host-side harness (make eval-offline)
    volumes:
      - chroma:/data
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [internal, edge]

  # --- observability profile (M9, ADR-0022): Langfuse v4 ------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    profiles: [observability]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/low-memory-config.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/low-memory-users.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MEMORY_LIMIT:-1G}
    networks: [internal]

  valkey:
    image: valkey/valkey:8.1.11-alpine
    profiles: [observability]
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --maxmemory 96mb --maxmemory-policy noeviction"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [internal]

  langfuse-bucket:   # one-shot: the S3 bucket for Langfuse events and media (backend image: boto3 is there)
    image: leave-assistant/backend:dev
    profiles: [observability]
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, boto3
        s3 = boto3.client("s3", endpoint_url="http://seaweedfs:8333", region_name="us-east-1",
                          aws_access_key_id=os.environ["KEY"], aws_secret_access_key=os.environ["SECRET"])
        existing = {b["Name"] for b in s3.list_buckets().get("Buckets", [])}
        if "langfuse" not in existing:
            s3.create_bucket(Bucket="langfuse")
        print("bucket langfuse ready")
    environment:
      KEY: ${LANGFUSE_S3_ACCESS_KEY:-}
      SECRET: ${LANGFUSE_S3_SECRET_KEY:-}
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks: [internal]

  langfuse-worker:
    image: langfuse/langfuse-worker:4.76.0
    profiles: [observability]
    environment:
      <<: *langfuse-env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      langfuse-bucket:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: ${LANGFUSE_WORKER_MEMORY_LIMIT:-640M}
    networks: [internal]

  langfuse-web:
    image: langfuse/langfuse:4.76.0
    profiles: [observability]
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:8333
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://seaweedfs:8333
      AUTH_DISABLE_SIGNUP: "true"
      NODE_OPTIONS: --max-old-space-size=${LANGFUSE_WEB_HEAP_MB:-1024}   # the default heap ran out at start (M9)
      HOSTNAME: 0.0.0.0   # Next.js binds to $HOSTNAME; the container's own name resolves to one of its two networks
      # headless initialisation: organisation, project, API keys (the backend's LANGFUSE_PUBLIC/SECRET_KEY), owner
      LANGFUSE_INIT_ORG_ID: leave-assistant
      LANGFUSE_INIT_ORG_NAME: Leave Assistant
      LANGFUSE_INIT_PROJECT_ID: leave-assistant
      LANGFUSE_INIT_PROJECT_NAME: Leave Assistant
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-observability@leave.local}
      LANGFUSE_INIT_USER_NAME: Observability
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"   # UI and public API on localhost only (ADR-0022)
    depends_on:
      langfuse-worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${LANGFUSE_WEB_MEMORY_LIMIT:-1280M}
    networks: [internal, edge]

networks:
  edge:
  internal:

volumes:
  pgdata:
  seaweed:
  models:
  mailpit:
  n8n:
  chroma:
  clickhouse-data:
  clickhouse-logs:
